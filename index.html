<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kasatria Assignment</title>
</head>
<body>
  <div id="signin-view">
    <div class="signin-card">
      <h1>Welcome Back</h1>
      <p class="subtitle">Sign in with your Google account to load the dataset.</p>

      <button id="signin" class="google-button" type="button">
        <span class="google-button__icon">
          <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
          </svg>
        </span>
        <span class="google-button__label">Sign in with Google</span>
      </button>

      <p id="status">Loading…</p>
    </div>
  </div>

  <div id="scene-view" hidden>
    <div id="container"></div>
    <div id="info"></div>
    <button id="signout" type="button">SIGN OUT</button>
    <div id="menu">
      <button id="table">TABLE</button>
      <button id="sphere">SPHERE</button>
      <button id="helix">HELIX</button>
      <button id="grid">GRID</button>
    </div>
    <div id="legend">
      <span>LOW</span>
      <span class="ramp"></span>
      <span>High</span>
    </div>

    <div id="confirm" hidden>
      <div class="confirm-backdrop"></div>
      <div class="confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
        <h2 id="confirm-title">Sign out?</h2>
        <p>This closes the dataset and returns you to the sign-in page, where you can pick a different Google account.</p>
        <div class="confirm-actions">
          <button id="confirm-cancel" type="button">CANCEL</button>
          <button id="confirm-ok" type="button">SIGN OUT</button>
        </div>
      </div>
    </div>

    <div id="detail" hidden>
      <div class="detail-backdrop"></div>
      <div class="detail-card" role="dialog" aria-modal="true" aria-label="Person details">
        <button class="detail-close" type="button" aria-label="Close">&times;</button>
        <div class="detail-body"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
